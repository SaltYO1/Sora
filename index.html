<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空 Sora N3</title>
<meta name="description" content="Личный курс японского N3: лексика, грамматика, кандзи, чтение.">
<meta name="theme-color" content="#6f93cf" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a3a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sora N3">
<script>try { var t = JSON.parse(localStorage.getItem("sora:theme")), d = document.documentElement.dataset; if (t && t !== "auto") { d.theme = t; if (t !== "light" && t !== "dark") d.scene = t; } } catch (e) {}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"><canvas id="bgSky" data-seed="5"></canvas></div>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Разделы">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">空</div>
      <div><b>Sora</b><small>Japanese · N3</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <label class="switch" for="furi">Фуригана <input type="checkbox" id="furi" checked></label>
      <div class="status" id="status"><span class="dot"></span>Загрузка…</div>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div style="min-width:0">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Открыть меню" aria-controls="side" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M2 4.5h14M2 9h14M2 13.5h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <b id="topTitle">Главная</b><span class="jp" id="topJp">ホーム</span>
      <div class="top-actions">
        <button class="tbtn" data-pop="theme" aria-label="Тема" aria-haspopup="dialog" aria-controls="popTheme" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="6.6" stroke="currentColor" stroke-width="1.6"/><path d="M9 2.4a6.6 6.6 0 0 1 0 13.2z" fill="currentColor"/></svg>
          <span>Тема</span></button>
        <button class="tbtn" data-pop="save" aria-label="Сохранение" aria-haspopup="dialog" aria-controls="popSave" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M5 13.5H4.6a3.1 3.1 0 0 1-.4-6.2 4.9 4.9 0 0 1 9.5-.9 3.6 3.6 0 0 1 .3 7.1H13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M9 8.6v6.2m0 0-2.2-2.2M9 14.8l2.2-2.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Сохранение</span></button>
      </div>
    </header>
    <main class="main" id="main"><div class="loading">読み込み中…</div></main>
  </div>
</div>

<div class="pop" id="popTheme" role="dialog" aria-label="Тема" hidden><h2>Тема <span class="jp">テーマ</span></h2><div class="pop-body"></div></div>
<div class="pop" id="popSave" role="dialog" aria-label="Сохранение" hidden><h2>Сохранение <span class="jp">保存</span></h2><div class="pop-body"></div></div>

<div id="tip" role="dialog" aria-live="polite" hidden>
  <button class="tip-close" id="tipClose" aria-label="Закрыть">×</button>
  <div id="tipBody"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
